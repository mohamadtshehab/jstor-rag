[project]
name = "jstor-rag-backend"
version = "0.1.0"
description = "JSTOR RAG Chrome Extension — Backend API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "google-genai",
    "chromadb",
    "httpx",
    "websockets",
    "playwright",
    "playwright-stealth",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
